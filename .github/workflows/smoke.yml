name: smoke

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Compile
        run: python3 -m compileall dashboard_server scripts
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Browser control state machine
        run: node tests/test_rover_browser.js
      - name: GPS map follow and replay
        run: node tests/test_gps_map.mjs
      - name: Build dashboard image
        run: docker build --file Dockerfile --tag unist-orchard-dashboard:smoke .
      - name: Build ROS2 runtime image
        run: docker build --file Dockerfile.ros2 --tag unist-orchard-dashboard-ros2:smoke .
      - name: ROS Iron camera bearing contract smoke
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --workdir /workspace \
            unist-orchard-dashboard-ros2:smoke \
            /bin/bash -lc 'source /opt/ros/iron/setup.bash && python3 -m unittest discover -s tests -p "test_camera_ws_bridge.py" && python3 -m unittest discover -s tests -p "test_data_recorder_service.py" && python3 -m unittest discover -s tests -p "test_gps*.py"'
      - name: Isolated four-sensor ROS recording
        run: |
          mkdir -p runtime data
          docker run --rm --network none -e ROS_DOMAIN_ID=173 -e UBTS_GPS_INTEGRATION_TEST=1 \
            --volume "$PWD:/workspace:ro" --tmpfs /workspace/runtime:rw --tmpfs /workspace/data:rw \
            --workdir /workspace unist-orchard-dashboard-ros2:smoke \
            /bin/bash -lc 'source /opt/ros/iron/setup.bash && python3 -B -m unittest discover -s tests -p "test_gps_integration.py"'
