name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Compile
        run: python3 -m compileall dashboard_server scripts
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Docker build
        run: docker build -t unist-orachard-dashboard:test .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          set -euo pipefail
          url="https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          for attempt in 1 2 3 4 5; do
            if curl --retry 4 --retry-all-errors --retry-delay 5 -fsSL "$url" -o /tmp/cloudflared; then
              install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "cloudflared download failed after retries" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/jetson_deploy_key
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/jetson_deploy_key
          cat > ~/.ssh/config <<EOF
          Host jetson-dashboard
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ~/.ssh/jetson_deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id ${CF_ACCESS_CLIENT_ID} --service-token-secret ${CF_ACCESS_CLIENT_SECRET}
          EOF

      - name: Package application
        run: |
          tar \
            --exclude=.git \
            --exclude=runtime \
            --exclude=__pycache__ \
            --exclude='*.pyc' \
            -czf /tmp/unist_orachard_dashboard.tar.gz .

      - name: Deploy to Jetson
        run: |
          scp /tmp/unist_orachard_dashboard.tar.gz jetson-dashboard:/tmp/unist_orachard_dashboard.tar.gz
          ssh jetson-dashboard 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP_DIR=/home/unist/workspace/unist_orachard_dashboard
          mkdir -p "$APP_DIR/runtime" "$APP_DIR/data"
          find "$APP_DIR" -mindepth 1 -maxdepth 1 ! -name runtime ! -name data ! -name .env -exec rm -rf {} +
          tar -xzf /tmp/unist_orachard_dashboard.tar.gz -C "$APP_DIR"
          chown -R unist:unist "$APP_DIR"
          cd "$APP_DIR"
          test -s runtime/training_runs/orchard_trunk_teacher_ood_v1/weights/best.engine
          test -d runtime/models/hf/hub/models--openai--clip-vit-base-patch32
          bash scripts/configure_operational_vision_env.sh .env
          if docker compose version >/dev/null 2>&1; then
            COMPOSE="docker compose"
          else
            COMPOSE="docker-compose"
          fi
          python3 -m compileall dashboard_server scripts
          python3 -m unittest discover -s tests -p 'test_*.py'
          TARGET_SERVICES="vision-ai-worker ros2-camera-bridge ros2-lidar-bridge ros2-data-recorder dashboard"
          $COMPOSE build $TARGET_SERVICES

          # Compose 1.29 cannot inspect Docker 29's newer image metadata while
          # recreating an existing container. Remove only the service being
          # replaced; sensor drivers, rover bridge and Portainer stay running.
          recreate_service() {
            service="$1"
            container="$2"
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker ps -aq \
              --filter "label=com.docker.compose.project=unist_orachard_dashboard" \
              --filter "label=com.docker.compose.service=$service" \
              | xargs -r docker rm -f >/dev/null 2>&1 || true
            $COMPOSE up --no-deps -d "$service"
          }

          recreate_service vision-ai-worker unist-orachard-vision-ai
          recreate_service ros2-camera-bridge unist-orachard-ros2-camera-bridge
          recreate_service ros2-lidar-bridge unist-orachard-ros2-lidar-bridge
          recreate_service ros2-data-recorder unist-orachard-ros2-data-recorder
          recreate_service dashboard unist-orachard-dashboard
          $COMPOSE ps
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          checks = [
              ("dashboard", "http://127.0.0.1:8080/api/health"),
              ("vision-ai-worker", "http://127.0.0.1:8785/health"),
          ]
          for name, url in checks:
              last = ""
              for _ in range(60):
                  try:
                      payload = json.load(urllib.request.urlopen(url, timeout=3))
                      if payload.get("ok"):
                          if name == "vision-ai-worker":
                              if payload.get("backend") != "operational_yolo11_seg_clip_ood":
                                  raise RuntimeError(f"unexpected vision backend: {payload}")
                              if payload.get("revision") != "orchard_trunk_yolo11_trt_clip_ood_v1":
                                  raise RuntimeError(f"unexpected vision revision: {payload}")
                              if not str(payload.get("model") or "").endswith("best.engine + openai/clip-vit-base-patch32"):
                                  raise RuntimeError(f"TensorRT/CLIP model not active: {payload}")
                          print(f"{name} ok: {json.dumps(payload, ensure_ascii=False)}")
                          break
                      last = json.dumps(payload, ensure_ascii=False)
                  except Exception as exc:
                      last = str(exc)
                  time.sleep(2)
              else:
                  raise SystemExit(f"{name} health failed: {last}")
          PY
          docker exec unist-orachard-ros2-camera-bridge /bin/sh -lc 'test -n "$ORCHARD_VISION_AI_URL"'
          docker exec unist-orachard-ros2-data-recorder /bin/sh -lc 'test -n "$ORCHARD_VISION_AI_URL"'
          python3 - <<'PY'
          import json
          import subprocess
          import time
          from pathlib import Path

          status_path = Path("runtime/camera_bridge_status.json")
          last = "camera bridge status file has not been written"
          for _ in range(90):
              try:
                  status = json.loads(status_path.read_text(encoding="utf-8"))
                  vision = status.get("vision_publisher") or {}
                  payload = vision.get("last_payload") or {}
                  checks = {
                      "frame_topic_alive": status.get("frame_topic_alive") is True,
                      "inference_count": int(vision.get("inference_count") or 0) > 0,
                      "publish_count": int(vision.get("publish_count") or 0) > 0,
                      "publisher_schema": vision.get("schema") == "orchard.camera_bearings.v1",
                      "payload_schema": payload.get("schema") == "orchard.camera_bearings.v1",
                      "payload_ok": payload.get("ok") is True,
                      "payload_algorithm": payload.get("algorithm") == "local_orchard_vision_ai_worker_v4",
                      "payload_revision": payload.get("revision") == "orchard_trunk_yolo11_trt_clip_ood_v1",
                      "payload_source": payload.get("source") == "camera_ws_bridge_shared_worker_v4",
                      "payload_frame": payload.get("frame_id") == "camera_link",
                      "bearing_calibration_requested": vision.get("bearing_calibration_requested") is False,
                      "bearing_calibration_valid": vision.get("bearing_calibration_valid") is False,
                      "metric_range_valid": vision.get("metric_range_valid") is False,
                  }
                  if all(checks.values()):
                      print(f"camera always-on vision publisher ok: {json.dumps(vision, ensure_ascii=False)}")
                      break
                  failed = [name for name, passed in checks.items() if not passed]
                  last = json.dumps(
                      {"failed": failed, "status_error": status.get("error"), "vision": vision},
                      ensure_ascii=False,
                  )
              except (OSError, ValueError, json.JSONDecodeError) as exc:
                  last = f"{type(exc).__name__}: {exc}"
              time.sleep(2)
          else:
              logs = subprocess.run(
                  ["docker", "logs", "--tail", "80", "unist-orachard-ros2-camera-bridge"],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              raise SystemExit(
                  "camera always-on vision publisher smoke failed after 180s; "
                  f"last_status={last}; container_logs={logs.stdout[-6000:]}{logs.stderr[-2000:]}"
              )
          PY
          docker exec unist-orachard-dashboard python /app/scripts/precompute_archive_camera_overlays.py \
            --recording-id 20260708T053333Z_both \
            --recording-id 20260708T054036Z_both
          docker exec unist-orachard-dashboard python /app/scripts/precompute_archive_lidar_overlays.py \
            --recording-id 20260708T053333Z_both \
            --recording-id 20260708T054036Z_both
          docker exec unist-orachard-dashboard python /app/scripts/precompute_orchard_maps.py \
            --recording-id 20260708T053333Z_both \
            --recording-id 20260708T054036Z_both \
            --recording-id 20260721T081819Z_both \
            --recording-id 20260721T082224Z_both \
            --recording-id 20260721T082612Z_both
          python3 scripts/build_operational_readiness_summary.py
          python3 - <<'PY'
          import gzip
          import json
          import urllib.request

          research_readiness = []
          for recording_id in (
              "20260708T053333Z_both",
              "20260708T054036Z_both",
              "20260721T081819Z_both",
              "20260721T082224Z_both",
              "20260721T082612Z_both",
          ):
              map_url = f"http://127.0.0.1:8080/api/recordings/{recording_id}/orchard-map"
              orchard_map = json.load(urllib.request.urlopen(map_url, timeout=60))["map"]
              assert orchard_map["algorithm"] == "orchard_metric_anchor_semantic_fusion_local_frenet_v9", orchard_map["algorithm"]
              assert orchard_map["cache_revision"] == "v9_rep103_provenance_continuity_readiness_r3", orchard_map
              assert orchard_map["ok"] is True
              actual_layers = {name: len(layer["trees"]) for name, layer in orchard_map["maps"].items()}
              assert set(actual_layers) == {"lidar", "camera", "fusion"}, actual_layers
              fusion = orchard_map["fusion"]
              assert fusion["position_policy"].startswith("LiDAR supplies metric"), fusion
              assert fusion["metric_anchor_count"] == actual_layers["lidar"], (fusion, actual_layers)
              assert fusion["metric_anchor_count"] + fusion["camera_only_promoted_count"] == actual_layers["fusion"], fusion
              assert fusion["sync"]["lidar_frames"] == len(orchard_map["path"]), fusion["sync"]
              assert fusion["sync"]["matched_frames"] + fusion["sync"]["outside_gate_frames"] + fusion["sync"]["camera_unavailable_frames"] == len(orchard_map["path"]), fusion["sync"]
              assert fusion["sync"]["max_delta_s"] == 0.25, fusion["sync"]
              assert all(
                  tree.get("metric_anchor") in {"lidar", "camera_calibrated"}
                  for tree in orchard_map["maps"]["fusion"]["trees"]
              )
              centerline = orchard_map["centerline"]
              assert centerline["method"] == "trajectory_segmented_local_frenet_robust_rows_v9", centerline
              assert centerline["ok"] is True or centerline["points"] == [], centerline
              for segment in centerline.get("segments", []):
                  assert segment["method"] == "trajectory_segmented_local_frenet_robust_rows_v9", segment
                  if segment["ok"]:
                      assert segment["straddles_vehicle"] is True, segment
                      assert segment["left_occupied_bins"] >= 3, segment
                      assert segment["right_occupied_bins"] >= 3, segment
                      assert segment["left_longitudinal_span_m"] >= 4.0, segment
                      assert segment["right_longitudinal_span_m"] >= 4.0, segment
                      assert segment["bilateral_overlap_span_m"] >= 4.0, segment
                      assert segment["bilateral_coverage_ratio"] >= 0.5, segment
                      assert segment["paired_gap_count"] >= 2, segment
                      assert segment["contiguous_paired_bin_count"] >= 2, segment
                      assert segment["max_consecutive_paired_bin_gap"] <= 2, segment
                      assert segment["paired_bin_density_ratio"] >= 0.5, segment
                      assert segment["paired_station_coverage_ratio"] >= 0.35, segment
                      interval = segment["paired_interval_s_m"]
                      assert interval and all(interval[0] <= point["s_m"] <= interval[1] for point in segment["points"]), segment
                  else:
                      assert segment["fail_closed"] is True and segment["points"] == [], segment

              segment_url = f"http://127.0.0.1:8080/api/recordings/{recording_id}/timeline?start_s=0&duration_s=4"
              request = urllib.request.Request(segment_url, headers={"Accept-Encoding": "gzip"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read()
                  assert response.headers.get("Content-Encoding") == "gzip", response.headers
              payload = json.loads(gzip.decompress(raw))
              for frame in payload["timeline"]["camera"]["frames"]:
                  overlay = frame.get("overlay") or {}
                  assert overlay.get("algorithm") == "local_orchard_vision_ai_worker_v4", overlay
                  assert overlay.get("revision") == "orchard_trunk_yolo11_trt_clip_ood_v1", overlay
              for frame in payload["timeline"]["lidar"]["frames"]:
                  overlay = frame.get("overlay") or {}
                  assert overlay.get("algorithm") == "polar_gap_cluster_wall_context_tree_ood_predictive_tracks_v6", overlay
              readiness = orchard_map.get("readiness") or {}
              assert type(readiness.get("data_sufficiency_ok")) is bool, readiness
              assert type(readiness.get("navigation_ready")) is bool, readiness
              research_readiness.append(
                  {
                      "recording_id": recording_id,
                      "data_sufficiency_ok": readiness["data_sufficiency_ok"],
                      "navigation_ready": readiness["navigation_ready"],
                      "layer_counts": actual_layers,
                      "semantic_supported_count": fusion["semantic_supported_count"],
                      "centerline_ok": bool(centerline["ok"]),
                      "centerline_state": centerline.get("state"),
                  }
              )
          print(
              json.dumps(
                  {
                      "deployment_safety_contract_ok": True,
                      "research_readiness_is_non_blocking": True,
                      "research_readiness": research_readiness,
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY
          REMOTE
