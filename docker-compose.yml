services:
  dashboard:
    build:
      context: .
    image: unist-orachard-dashboard:latest
    container_name: unist-orachard-dashboard
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    privileged: true
    depends_on:
      - vision-ai-worker
      - ros2-imu-bridge
    environment:
      DASHBOARD_HOST: "0.0.0.0"
      DASHBOARD_PORT: "8080"
      DASHBOARD_MODE: "live"
      DASHBOARD_CONTAINER_NAME: "unist-orachard-dashboard"
      TELEMETRY_FILE: "/app/runtime/telemetry_snapshot.json"
      HOST_ROOT: "/host-root"
      HOST_PROC: "/proc"
      HOST_SYS: "/sys"
      DASHBOARD_HOSTNAME_FILE: "/host-root/etc/hostname"
      JETSON_RELEASE_FILE: "/etc/nv_tegra_release"
      DOCKER_SOCKET: "/var/run/docker.sock"
      LIDAR_DEV_ROOT: "/host-dev"
      LIDAR_BAUDS: "1000000,460800,256000,115200"
      LIDAR_WS_UPSTREAM: "ws://127.0.0.1:8765/ws/lidar"
      LIDAR_BRIDGE_STATUS_FILE: "/app/runtime/lidar_bridge_status.json"
      CAMERA_DEV_ROOT: "/host-dev"
      CAMERA_WS_UPSTREAM: "ws://127.0.0.1:8770/ws/camera"
      CAMERA_DRIVER_STATUS_FILE: "/app/runtime/camera_driver_status.json"
      CAMERA_BRIDGE_STATUS_FILE: "/app/runtime/camera_bridge_status.json"
      IMU_WS_UPSTREAM: "ws://127.0.0.1:8775/ws/imu"
      IMU_DRIVER_STATUS_FILE: "/app/runtime/imu_driver_status.json"
      IMU_BRIDGE_STATUS_FILE: "/app/runtime/imu_bridge_status.json"
      CAMERA_SETTINGS_FILE: "/app/runtime/camera_settings.json"
      ROVER_BRIDGE_STATUS_FILE: "/app/runtime/rover_bridge_status.json"
      ROVER_COMMAND_FILE: "/app/runtime/rover_command.json"
      RECORDER_API_URL: "http://127.0.0.1:8790"
      DATA_RECORDER_STATUS_FILE: "/app/runtime/data_recorder_status.json"
      RECORDING_ARCHIVE_DIR: "/app/runtime/recordings"
      ORCHARD_VISION_AI_URL: "${ORCHARD_VISION_AI_URL:-http://127.0.0.1:8785/analyze}"
      ORCHARD_VISION_AI_TIMEOUT_S: "${ORCHARD_VISION_AI_TIMEOUT_S:-6.0}"
      ROVER_NETWORK_ENABLED: "${ROVER_NETWORK_ENABLED:-0}"
      ROVER_BASE_URL: "${ROVER_BASE_URL:-http://192.168.4.1}"
      ROVER_DASHBOARD_URL: "${ROVER_DASHBOARD_URL:-http://192.168.4.1}"
    volumes:
      - ./runtime:/app/runtime
      - ./data:/app/data
      - /:/host-root:ro
      - /dev:/host-dev
      - /etc/nv_tegra_release:/etc/nv_tegra_release:ro
      - /sys/class/thermal:/sys/class/thermal:ro
      - /sys/class/hwmon:/sys/class/hwmon:rw
      - /sys/devices:/sys/devices:rw
      - /run/systemd:/run/systemd:rw
      - /var/run/docker.sock:/var/run/docker.sock
    device_cgroup_rules:
      - "c 81:* rwm"
      - "c 166:* rwm"
      - "c 188:* rwm"
      - "c 204:* rwm"
      - "c 240:* rwm"
    pid: host
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  vision-ai-worker:
    build:
      context: .
      dockerfile: Dockerfile.vision_ai
      args:
        VISION_AI_BASE_IMAGE: "${VISION_AI_BASE_IMAGE:-roboflow/roboflow-inference-server-jetson-6.0.0:1.3.2-rc1}"
        VISION_AI_INSTALL_REQUIREMENTS: "${VISION_AI_INSTALL_REQUIREMENTS:-0}"
    image: unist-orachard-vision-ai:latest
    container_name: unist-orachard-vision-ai
    restart: unless-stopped
    network_mode: host
    ipc: host
    runtime: nvidia
    environment:
      VISION_AI_HOST: "0.0.0.0"
      VISION_AI_PORT: "8785"
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: "${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}"
      ORCHARD_VISION_BACKEND: "${ORCHARD_VISION_BACKEND:-operational}"
      ORCHARD_YOLO_MODEL: "${ORCHARD_YOLO_MODEL:-/app/runtime/training_runs/orchard_trunk_teacher_ood_v1/weights/best.engine}"
      ORCHARD_CLIP_MODEL: "${ORCHARD_CLIP_MODEL:-openai/clip-vit-base-patch32}"
      ORCHARD_CLIP_FP16: "${ORCHARD_CLIP_FP16:-1}"
      ORCHARD_VISION_REVISION: "${ORCHARD_VISION_REVISION:-orchard_trunk_yolo11_trt_clip_ood_v1}"
      ORCHARD_SEGFORMER_MODEL: "${ORCHARD_SEGFORMER_MODEL:-}"
      ORCHARD_ROBOFLOW_MODEL_ID: "${ORCHARD_ROBOFLOW_MODEL_ID:-tree-trunk-detection-369pz-vm3hn/2}"
      ORCHARD_VISION_CONFIDENCE: "${ORCHARD_VISION_CONFIDENCE:-0.08}"
      ORCHARD_VISION_DEVICE: "${ORCHARD_VISION_DEVICE:-}"
      MODEL_CACHE_DIR: "${MODEL_CACHE_DIR:-/app/runtime/roboflow_cache}"
      ONNXRUNTIME_EXECUTION_PROVIDERS: "${ONNXRUNTIME_EXECUTION_PROVIDERS:-CPUExecutionProvider}"
      MODELS_CACHE_AUTH_ENABLED: "${MODELS_CACHE_AUTH_ENABLED:-False}"
      DISK_CACHE_CLEANUP: "${DISK_CACHE_CLEANUP:-False}"
      USE_INFERENCE_MODELS: "${USE_INFERENCE_MODELS:-False}"
      TRANSFORMERS_OFFLINE: "${TRANSFORMERS_OFFLINE:-1}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-1}"
      HF_HOME: "${HF_HOME:-/app/runtime/models/hf}"
    volumes:
      - ./runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import json, sys, urllib.request; payload=json.load(urllib.request.urlopen('http://127.0.0.1:8785/health', timeout=3)); sys.exit(0 if payload.get('ok') else 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  ros2-lidar-driver:
    build:
      context: .
      dockerfile: Dockerfile.lidar_driver
    image: unist-orachard-ros2-lidar-driver:latest
    container_name: unist-orachard-ros2-lidar-driver
    restart: unless-stopped
    network_mode: host
    ipc: host
    privileged: true
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      LIDAR_SERIAL_PORT: "${LIDAR_SERIAL_PORT:-/dev/ttyUSB0}"
      LIDAR_SERIAL_BAUDRATE: "${LIDAR_SERIAL_BAUDRATE:-1000000}"
      LIDAR_FRAME_ID: "${LIDAR_FRAME_ID:-laser}"
      LIDAR_SCAN_MODE: "${LIDAR_SCAN_MODE:-DenseBoost}"
    volumes:
      - /dev:/dev
    device_cgroup_rules:
      - "c 166:* rwm"
      - "c 188:* rwm"
      - "c 204:* rwm"
      - "c 240:* rwm"

  ros2-camera-driver:
    build:
      context: .
      dockerfile: Dockerfile.ros2
    image: unist-orachard-ros2-camera-driver:latest
    container_name: unist-orachard-ros2-camera-driver
    restart: unless-stopped
    network_mode: host
    ipc: host
    privileged: true
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      CAMERA_DEVICE: "${CAMERA_DEVICE:-auto}"
      CAMERA_IMAGE_TOPIC: "${CAMERA_IMAGE_TOPIC:-/camera/image_raw}"
      CAMERA_INFO_TOPIC: "${CAMERA_INFO_TOPIC:-/camera/camera_info}"
      CAMERA_FRAME_ID: "${CAMERA_FRAME_ID:-camera_link_optical}"
      CAMERA_WIDTH: "${CAMERA_WIDTH:-1280}"
      CAMERA_HEIGHT: "${CAMERA_HEIGHT:-720}"
      CAMERA_FPS: "${CAMERA_FPS:-60}"
      CAMERA_FOURCC: "${CAMERA_FOURCC:-MJPG}"
      CAMERA_FOV_DEG: "${CAMERA_FOV_DEG:-70}"
      CAMERA_ROTATE_180: "${CAMERA_ROTATE_180:-1}"
      CAMERA_DRIVER_STATUS_FILE: "/app/runtime/camera_driver_status.json"
      CAMERA_SETTINGS_FILE: "/app/runtime/camera_settings.json"
      CAMERA_MAX_TICK_FPS: "${CAMERA_MAX_TICK_FPS:-60}"
      CAMERA_AUTO_USB_RECOVER: "${CAMERA_AUTO_USB_RECOVER:-1}"
      CAMERA_USB_RECOVER_INTERVAL_S: "${CAMERA_USB_RECOVER_INTERVAL_S:-12}"
      CAMERA_USB_RECOVER_MAX_INTERVAL_S: "${CAMERA_USB_RECOVER_MAX_INTERVAL_S:-120}"
      CAMERA_AUTHORIZED_CYCLE_EVERY: "${CAMERA_AUTHORIZED_CYCLE_EVERY:-3}"
      HOST_USB_SYS: "/host-sys/bus/usb/devices"
    volumes:
      - /dev:/dev
      - /sys:/host-sys:rw
      - ./runtime:/app/runtime
    device_cgroup_rules:
      - "c 81:* rwm"
    command:
      - /bin/bash
      - -lc
      - |
        source /opt/ros/iron/setup.bash
        python3 /app/scripts/camera_ros2_driver.py \
          --device "$${CAMERA_DEVICE}" \
          --image-topic "$${CAMERA_IMAGE_TOPIC}" \
          --camera-info-topic "$${CAMERA_INFO_TOPIC}" \
          --frame-id "$${CAMERA_FRAME_ID}" \
          --width "$${CAMERA_WIDTH}" \
          --height "$${CAMERA_HEIGHT}" \
          --fps "$${CAMERA_FPS}" \
          --fourcc "$${CAMERA_FOURCC}" \
          --fov-deg "$${CAMERA_FOV_DEG}" \
          --rotate-180 \
          --status-file "$${CAMERA_DRIVER_STATUS_FILE}" \
          --settings-file "$${CAMERA_SETTINGS_FILE}" \
          --max-tick-fps "$${CAMERA_MAX_TICK_FPS}"

  ros2-lidar-bridge:
    build:
      context: .
      dockerfile: Dockerfile.ros2
    image: unist-orachard-ros2-lidar-bridge:latest
    container_name: unist-orachard-ros2-lidar-bridge
    restart: unless-stopped
    network_mode: host
    ipc: host
    depends_on:
      - ros2-lidar-driver
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      LIDAR_BRIDGE_SOURCE: "${LIDAR_BRIDGE_SOURCE:-ros2}"
      LIDAR_SCAN_MAX_POINTS: "${LIDAR_SCAN_MAX_POINTS:-3200}"
      LIDAR_BRIDGE_STATUS_FILE: "/app/runtime/lidar_bridge_status.json"
    volumes:
      - ./runtime:/app/runtime
    command:
      - /bin/bash
      - -lc
      - |
        source /opt/ros/iron/setup.bash
        python3 /app/scripts/lidar_ws_bridge.py \
          --host 0.0.0.0 \
          --port 8765 \
          --topic /scan \
          --source "$${LIDAR_BRIDGE_SOURCE}" \
          --max-points "$${LIDAR_SCAN_MAX_POINTS}" \
          --max-hz 10

  ros2-camera-bridge:
    build:
      context: .
      dockerfile: Dockerfile.ros2
    image: unist-orachard-ros2-camera-bridge:latest
    container_name: unist-orachard-ros2-camera-bridge
    restart: unless-stopped
    network_mode: host
    ipc: host
    depends_on:
      - ros2-camera-driver
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      CAMERA_IMAGE_TOPIC: "${CAMERA_IMAGE_TOPIC:-/camera/image_raw}"
      CAMERA_INFO_TOPIC: "${CAMERA_INFO_TOPIC:-/camera/camera_info}"
      CAMERA_BRIDGE_STATUS_FILE: "/app/runtime/camera_bridge_status.json"
      ORCHARD_VISION_AI_URL: "${ORCHARD_VISION_AI_URL:-http://127.0.0.1:8785/analyze}"
      ORCHARD_VISION_AI_TIMEOUT_S: "${ORCHARD_VISION_AI_TIMEOUT_S:-6.0}"
      ORCHARD_VISION_BEARINGS_TOPIC: "${ORCHARD_VISION_BEARINGS_TOPIC:-/orchard/vision/tree_bearings}"
      ORCHARD_VISION_PUBLISH_HZ: "${ORCHARD_VISION_PUBLISH_HZ:-5.0}"
      ORCHARD_VISION_INFERENCE_WIDTH: "${ORCHARD_VISION_INFERENCE_WIDTH:-0}"
      ORCHARD_VISION_INFERENCE_JPEG_QUALITY: "${ORCHARD_VISION_INFERENCE_JPEG_QUALITY:-86}"
      ORCHARD_VISION_FRAME_ID: "${ORCHARD_VISION_FRAME_ID:-camera_link}"
      ORCHARD_VISION_BEARING_CALIBRATION_VALID: "${ORCHARD_VISION_BEARING_CALIBRATION_VALID:-0}"
      ORCHARD_CAMERA_INFO_SYNC_MAX_DELTA_S: "${ORCHARD_CAMERA_INFO_SYNC_MAX_DELTA_S:-0.12}"
      CAMERA_FOV_DEG: "${CAMERA_FOV_DEG:-70.0}"
    volumes:
      - ./runtime:/app/runtime
    command:
      - /bin/bash
      - -lc
      - |
        source /opt/ros/iron/setup.bash
        python3 /app/scripts/camera_ws_bridge.py \
          --host 0.0.0.0 \
          --port 8770 \
          --topic "$${CAMERA_IMAGE_TOPIC}" \
          --camera-info-topic "$${CAMERA_INFO_TOPIC}" \
          --vision-topic "$${ORCHARD_VISION_BEARINGS_TOPIC}" \
          --vision-hz "$${ORCHARD_VISION_PUBLISH_HZ}" \
          --vision-inference-width "$${ORCHARD_VISION_INFERENCE_WIDTH}" \
          --vision-inference-jpeg-quality "$${ORCHARD_VISION_INFERENCE_JPEG_QUALITY}" \
          --vision-output-frame "$${ORCHARD_VISION_FRAME_ID}" \
          --vision-nominal-fov-deg "$${CAMERA_FOV_DEG}" \
          --camera-info-sync-max-delta-s "$${ORCHARD_CAMERA_INFO_SYNC_MAX_DELTA_S}" \
          --status-file "$${CAMERA_BRIDGE_STATUS_FILE}"

  ros2-imu-driver:
    build:
      context: .
      dockerfile: Dockerfile.ros2
    image: unist-orachard-ros2-imu-driver:latest
    container_name: unist-orachard-ros2-imu-driver
    restart: unless-stopped
    network_mode: host
    ipc: host
    devices:
      - "/dev/i2c-${IMU_I2C_BUS:-7}:/dev/i2c-${IMU_I2C_BUS:-7}"
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      IMU_I2C_BUS: "${IMU_I2C_BUS:-7}"
      IMU_I2C_ADDRESS: "${IMU_I2C_ADDRESS:-0x4A}"
      IMU_SAMPLE_HZ: "${IMU_SAMPLE_HZ:-20}"
      IMU_FRAME_ID: "${IMU_FRAME_ID:-imu_link}"
      IMU_RAW_TOPIC: "${IMU_RAW_TOPIC:-/imu/data_raw}"
      IMU_MAG_TOPIC: "${IMU_MAG_TOPIC:-/imu/mag}"
      IMU_DRIVER_STATUS_TOPIC: "${IMU_DRIVER_STATUS_TOPIC:-/orchard/imu/driver_status}"
      IMU_DRIVER_STATUS_FILE: "/app/runtime/imu_driver_status.json"
    volumes:
      - ./runtime:/app/runtime
    command:
      - /bin/bash
      - -lc
      - |
        source /opt/ros/iron/setup.bash
        python3 /app/scripts/imu_ros2_driver.py \
          --i2c-bus "$${IMU_I2C_BUS}" \
          --i2c-address "$${IMU_I2C_ADDRESS}" \
          --sample-hz "$${IMU_SAMPLE_HZ}" \
          --frame-id "$${IMU_FRAME_ID}" \
          --raw-topic "$${IMU_RAW_TOPIC}" \
          --mag-topic "$${IMU_MAG_TOPIC}" \
          --status-topic "$${IMU_DRIVER_STATUS_TOPIC}" \
          --status-file "$${IMU_DRIVER_STATUS_FILE}"

  ros2-imu-bridge:
    build:
      context: .
      dockerfile: Dockerfile.ros2
    image: unist-orachard-ros2-imu-bridge:latest
    container_name: unist-orachard-ros2-imu-bridge
    restart: unless-stopped
    network_mode: host
    ipc: host
    depends_on:
      - ros2-imu-driver
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      IMU_RAW_TOPIC: "${IMU_RAW_TOPIC:-/imu/data_raw}"
      IMU_CORRECTED_TOPIC: "${IMU_CORRECTED_TOPIC:-/imu/data}"
      IMU_MAG_TOPIC: "${IMU_MAG_TOPIC:-/imu/mag}"
      IMU_CALIBRATION_TOPIC: "${IMU_CALIBRATION_TOPIC:-/orchard/imu/calibration}"
      IMU_BRIDGE_MAX_HZ: "${IMU_BRIDGE_MAX_HZ:-20}"
      IMU_BRIDGE_STATUS_FILE: "/app/runtime/imu_bridge_status.json"
    volumes:
      - ./runtime:/app/runtime
    command:
      - /bin/bash
      - -lc
      - |
        source /opt/ros/iron/setup.bash
        python3 /app/scripts/imu_ws_bridge.py \
          --host 0.0.0.0 \
          --port 8775 \
          --raw-topic "$${IMU_RAW_TOPIC}" \
          --corrected-topic "$${IMU_CORRECTED_TOPIC}" \
          --mag-topic "$${IMU_MAG_TOPIC}" \
          --calibration-topic "$${IMU_CALIBRATION_TOPIC}" \
          --max-hz "$${IMU_BRIDGE_MAX_HZ}" \
          --status-file "$${IMU_BRIDGE_STATUS_FILE}"

  ros2-rover-bridge:
    build:
      context: .
      dockerfile: Dockerfile.ros2
    image: unist-orachard-ros2-rover-bridge:latest
    container_name: unist-orachard-ros2-rover-bridge
    restart: unless-stopped
    network_mode: host
    ipc: host
    privileged: true
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      ROVER_TRANSPORT: "${ROVER_TRANSPORT:-serial}"
      ROVER_SERIAL_PORT: "${ROVER_SERIAL_PORT:-/dev/ttyTHS1}"
      ROVER_SERIAL_BAUDRATE: "${ROVER_SERIAL_BAUDRATE:-115200}"
      ROVER_ALLOW_NETWORK: "0"
      ROVER_PROBE_SERIAL_ON_START: "${ROVER_PROBE_SERIAL_ON_START:-1}"
      ROVER_BASE_URL: "${ROVER_BASE_URL:-http://192.168.4.1}"
      ROVER_BRIDGE_STATUS_FILE: "/app/runtime/rover_bridge_status.json"
      ROVER_COMMAND_FILE: "/app/runtime/rover_command.json"
      ROVER_CMD_TOPIC: "${ROVER_CMD_TOPIC:-/cmd_vel}"
      ROVER_STATUS_TOPIC: "${ROVER_STATUS_TOPIC:-/rover/status}"
    volumes:
      - ./runtime:/app/runtime
      - /dev:/dev
    device_cgroup_rules:
      - "c 204:* rwm"
      - "c 240:* rwm"
      - "c 4:* rwm"
    command:
      - /bin/bash
      - -lc
      - |
        source /opt/ros/iron/setup.bash
        python3 /app/scripts/wave_rover_bridge.py \
          --transport "$${ROVER_TRANSPORT}" \
          --serial-port "$${ROVER_SERIAL_PORT}" \
          --serial-baudrate "$${ROVER_SERIAL_BAUDRATE}" \
          --base-url "$${ROVER_BASE_URL}" \
          --cmd-topic "$${ROVER_CMD_TOPIC}" \
          --status-topic "$${ROVER_STATUS_TOPIC}" \
          --status-file "$${ROVER_BRIDGE_STATUS_FILE}" \
          --command-file "$${ROVER_COMMAND_FILE}" \
          --no-allow-network \
          --probe-serial-on-start

  ros2-data-recorder:
    build:
      context: .
      dockerfile: Dockerfile.ros2
    image: unist-orachard-ros2-data-recorder:latest
    container_name: unist-orachard-ros2-data-recorder
    restart: unless-stopped
    network_mode: host
    ipc: host
    depends_on:
      - ros2-lidar-driver
      - ros2-camera-driver
      - ros2-camera-bridge
      - ros2-imu-driver
      - ros2-imu-bridge
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      RECORDER_HOST: "127.0.0.1"
      RECORDER_PORT: "8790"
      RECORDING_ARCHIVE_DIR: "/app/runtime/recordings"
      DATA_RECORDER_STATUS_FILE: "/app/runtime/data_recorder_status.json"
      LIDAR_SCAN_TOPIC: "${LIDAR_SCAN_TOPIC:-/scan}"
      CAMERA_IMAGE_TOPIC: "${CAMERA_IMAGE_TOPIC:-/camera/image_raw}"
      CAMERA_INFO_TOPIC: "${CAMERA_INFO_TOPIC:-/camera/camera_info}"
      ROVER_CMD_TOPIC: "${ROVER_CMD_TOPIC:-/cmd_vel}"
      ROVER_STATUS_TOPIC: "${ROVER_STATUS_TOPIC:-/rover/status}"
      ODOM_TOPIC: "${ODOM_TOPIC:-/odom}"
      IMU_RAW_TOPIC: "${IMU_RAW_TOPIC:-/imu/data_raw}"
      IMU_CORRECTED_TOPIC: "${IMU_CORRECTED_TOPIC:-/imu/data}"
      IMU_MAG_TOPIC: "${IMU_MAG_TOPIC:-/imu/mag}"
      IMU_DRIVER_STATUS_TOPIC: "${IMU_DRIVER_STATUS_TOPIC:-/orchard/imu/driver_status}"
      IMU_CALIBRATION_TOPIC: "${IMU_CALIBRATION_TOPIC:-/orchard/imu/calibration}"
      TF_TOPIC: "${TF_TOPIC:-/tf}"
      TF_STATIC_TOPIC: "${TF_STATIC_TOPIC:-/tf_static}"
      ORCHARD_VISION_BEARINGS_TOPIC: "${ORCHARD_VISION_BEARINGS_TOPIC:-/orchard/vision/tree_bearings}"
      RECORDER_PREVIEW_MAX_POINTS: "${RECORDER_PREVIEW_MAX_POINTS:-1200}"
      RECORDER_TIMELINE_HZ: "${RECORDER_TIMELINE_HZ:-2.0}"
      RECORDER_TIMELINE_MAX_FRAMES: "${RECORDER_TIMELINE_MAX_FRAMES:-1800}"
      RECORDER_IMU_TIMELINE_HZ: "${RECORDER_IMU_TIMELINE_HZ:-10.0}"
      RECORDER_IMU_TIMELINE_MAX_FRAMES: "${RECORDER_IMU_TIMELINE_MAX_FRAMES:-18000}"
      RECORDER_IMU_CALIBRATION_WINDOW_S: "${RECORDER_IMU_CALIBRATION_WINDOW_S:-1.5}"
      RECORDER_IMU_CALIBRATION_MIN_SAMPLES: "${RECORDER_IMU_CALIBRATION_MIN_SAMPLES:-20}"
      RECORDER_IMU_STATIONARY_MAX_GYRO_RAD_S: "${RECORDER_IMU_STATIONARY_MAX_GYRO_RAD_S:-0.08}"
      RECORDER_IMU_STATIONARY_GRAVITY_TOLERANCE_M_S2: "${RECORDER_IMU_STATIONARY_GRAVITY_TOLERANCE_M_S2:-2.0}"
      RECORDER_IMU_STATIONARY_MAX_ACCEL_STD_M_S2: "${RECORDER_IMU_STATIONARY_MAX_ACCEL_STD_M_S2:-0.35}"
      RECORDER_CAMERA_PREVIEW_WIDTH: "${RECORDER_CAMERA_PREVIEW_WIDTH:-640}"
      RECORDER_CAMERA_JPEG_QUALITY: "${RECORDER_CAMERA_JPEG_QUALITY:-68}"
      RECORDER_SHARED_VISION_SYNC_MAX_DELTA_S: "${RECORDER_SHARED_VISION_SYNC_MAX_DELTA_S:-0.12}"
      RECORDER_SHARED_VISION_WAIT_TIMEOUT_S: "${RECORDER_SHARED_VISION_WAIT_TIMEOUT_S:-0.35}"
      RECORDER_CAMERA_ARCHIVE_FLUSH_TIMEOUT_S: "${RECORDER_CAMERA_ARCHIVE_FLUSH_TIMEOUT_S:-0.75}"
    volumes:
      - ./runtime:/app/runtime
    command:
      - /bin/bash
      - -lc
      - |
        source /opt/ros/iron/setup.bash
        python3 /app/scripts/data_recorder_service.py \
          --host "$${RECORDER_HOST}" \
          --port "$${RECORDER_PORT}" \
          --archive-dir "$${RECORDING_ARCHIVE_DIR}" \
          --status-file "$${DATA_RECORDER_STATUS_FILE}" \
          --scan-topic "$${LIDAR_SCAN_TOPIC}" \
          --camera-topic "$${CAMERA_IMAGE_TOPIC}" \
          --camera-info-topic "$${CAMERA_INFO_TOPIC}" \
          --cmd-topic "$${ROVER_CMD_TOPIC}" \
          --rover-status-topic "$${ROVER_STATUS_TOPIC}" \
          --odom-topic "$${ODOM_TOPIC}" \
